      <div class="header">

        <li><a href="#" class="btn1">運動媒合平台</a></li>

      <!-- 主視覺區塊 -->
      <div class="top-out" data-aos="zoom-in-down">
        <div class="top">
          <div class="left">
            <h1 class="title">Sport Match</h1>
            <h3 class="third-title">
                |　運動媒合平台</h3>

            <ul class="hashtag">
              <li>HTML</li>
              <li>CSS</li>
              <li>javaScript</li>
              <li>UI Design</li>
              <li>Figma</li>
            </ul>
          </div>
          <div class="right">
            <div class="pro-img"><img src="img/Pro11.png" alt="" /></div>
            <a href="https://youtu.be/mlFYIIGWcRs?si=bc8_u4xQ_GKHyPK2" class="demo-btn" target="_blank">系統展示影片</a>
          </div>
        </div>
      </div>
      <!-- 專案總覽區塊 -->
        <ul class="keyword">
            <li  data-aos="flip-down">
                <!-- <span><i class="ph-fill ph-map-pin"></i></span> -->
                <img src="./img/map.png" alt="">

                <div class="text">
                  <h4 class="forth-title">地圖搜尋</h4>
                  <p>快速搜尋附近的運動，輕鬆掌握場地位置、時間等資訊，找到最適合的運動。</p>
                </div>
            </li>
            <li  data-aos="flip-down">
                <!-- <span><i class="ph-fill ph-users"></i></span> -->
                <img src="./img/sport.png" alt="">
                <div class="text">
                  <h4 class="forth-title">活動參與</h4>
                  <p>一鍵報名喜歡或有興趣的運動，與志同道合的夥伴一起享受運動樂趣。</p>
                </div>
            </li>
            <li  data-aos="flip-down">
                <!-- <span><i class="ph-fill ph-star"></i></span> -->
                <img src="./img/good.png" alt="">
                <div class="text">
                  <h4 class="forth-title">評價系統</h4>
                  <p>活動結束後留下評價，分享參與心得，共同打造更優質的運動體驗。</p>
                </div>
            </li>
          </ul>
