<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&display=swap" rel="stylesheet">
        <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css"
    />

    <title>Sport Match | 運動媒合平台</title>
    <style>
        @import url("reset.css");

        @font-face {
        font-family: 'BlueWinter';
        src: url('../weihsun1128.github.io/fonts/BlueWinter.otf');
        }

        body{
            font-family: 'Noto Sans TC', sans-serif;
            font-weight: 400;/* 500、700 */
            font-style: normal;
            font-size: 16px;
        }

        .wrapper{
            width: 100%;
            background-color: #FFE0E0;
        }

        .top{
            height: 80px;
            width: 100%;
            border-bottom: 3px solid #000;
            display: flex;
            justify-content: center;
            position: fixed;
            background-color: #fff;
        }

        .top h1{
            font-family: 'BlueWinter', sans-serif;
            font-size: 30px;
            line-height: 80px;
        }

        .header-out{
            width: 100%;
            background-color: #A8DCE3;
            border-bottom: 3px solid #000;

        }

        .header{
            width: 70%;
            margin: 0 auto;
            height: 480px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 80px;
        }
        .left{

        }
        .left .title{
            font-size: 32px;
            margin-bottom: 30px;
            font-weight: bold;
        }
        .left p{
            width: 480px;
            line-height: 1.5;
            margin-bottom: 40px;

        }

        .left a{
            background-color: #ffffff;
            padding: 8px 32px;
            border: 3px solid #000;
            border-radius: 50px;
            color: #000000;
            text-decoration: none;
            transition: 0.3s;

        }

        .left a:hover{
            background-color: #000;
            color: #ffffff;
        }

        .right .pro-img img{
            width: 500px;
        }

        .imgarea{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 36px;
            /* background-color: antiquewhite; */
            width: 80%;
            margin: 50px auto;

        }
        .imgarea img{
            width: 80%;
        }
        .footer{
            background-color: #000;
            color: #fff;
        }

        .footer-con{
            width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            line-height: 120px;
        }

        .footer-left{
            display: flex;
        }

        .footer-left h2{
            font-size: 20px;
            font-weight: 700;
            margin-right: 10px;
        }

        .footer-left p{
            color: #777777;
        }

        .footer-right{
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .footer-right p{
            color: #777777;
            margin-right: 20px;
        }

        .footer-right a{
            display: block;
            width: 40px;
            height: 40px;
            background-color: #FFE0E0;
            border-radius: 50%;
            position: relative;
        }

        .footer-right a:hover{
            background-color: #f27373;
        }

        .footer-right a i{
            color: #000000;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
</style>
</head>
<body>
    <div class="wrapper">
        <div class="top">
            <h1>HWH</h1>
        </div>
        <div class="header-out">
            <div class="header">
                <div class="left">
                    <h1 class="title">Sport Match | 運動媒合平台</h1>
                    <p>本專案為畢業專題，聚焦於運動參與率不足之議題，透過建構運動媒合平台，整合地圖搜尋與活動資訊，優化使用者尋找運動夥伴與場地之流程，進而提升整體參與意願與互動效率。</p>
                    <a href="#">系統展示影片</a>
                </div>
                <div class="right">
                    <div class="pro-img"><img src="img/5422.png" alt="">
                    </div>
                </div>
            </div>
        </div>
        <div class="imgarea">
            <img src="img/pro1-1.png" alt="">
            <img src="img/pro1-2.png" alt="">
            <img src="img/pro1-3.png" alt="">
            <img src="img/pro1-4.png" alt="">
            <img src="img/pro1-5.png" alt="">
            <img src="img/pro1-6.png" alt="">
            <img src="img/pro1-7.png" alt="">
            <img src="img/pro1-8.png" alt="">
            <img src="img/pro1-9.png" alt="">
            <img src="img/pro1-10.png" alt="">
            <img src="img/pro1-11.png" alt="">
            <img src="img/pro1-12.png" alt="">
            <img src="img/pro1-13.png" alt="">
            <img src="img/pro1-14.png" alt="">
            <img src="img/pro1-15.png" alt="">
            <img src="img/pro1-16.png" alt="">
            <img src="img/pro1-17.png" alt="">
            <img src="img/pro1-18.png" alt="">
            <img src="img/pro1-19.png" alt="">
            <img src="img/pro1-21.png" alt="">

        </div>
        <div class="footer">
            <div class="footer-con">
                <div class="footer-left">
                    <h2>Wei-Hsun Huang</h2>
                    <p>© 2026 All rights reserved.</p>
                </div>
                <div class="footer-right">
                    <p>Designed by 黃煒薰</p>
                    <a href="#" class="toTop"><i class="ph-bold ph-triangle"></i></a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
